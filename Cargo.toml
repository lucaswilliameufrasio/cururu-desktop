[package]
name = "cururu-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Desktop code review client for Cururu"

[dependencies]
anyhow = "1"
base64 = "=0.22.1"
cururu-core = { git = "https://github.com/lucaswilliameufrasio/cururu.git", rev = "3ea5deb" }
directories = "6"
futures = "0.3"
gpui = "0.2.2"
gpui-component = { version = "=0.3.0", default-features = false }
gix = { version = "=0.85.0", default-features = false, features = ["basic", "parallel", "sha1", "status"] }
http-body-util = "0.1"
keyring = "=4.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
similar = "2"
url = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
