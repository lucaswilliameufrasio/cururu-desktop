[package]
name = "cururu-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Desktop code review client for Cururu"

[dependencies]
anyhow = "1"
cururu-core = { git = "https://github.com/lucaswilliameufrasio/cururu.git", rev = "3ea5deb" }
gpui = "0.2.2"
gix = { version = "=0.87.0", default-features = false, features = ["basic", "parallel", "sha1"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
