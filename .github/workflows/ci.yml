name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux x86_64
            package_formats: appimage
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            package_formats: appimage
          - os: macos-15
            label: macOS Apple Silicon
            package_formats: app,dmg

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libvulkan-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check local cross-build helper syntax
        run: bash -n scripts/build-linux-arm64.sh

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace

      - name: Build release
        run: cargo build --locked --workspace --release

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version 0.11.8

      - name: Package without signing or publishing
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy's bundled strip cannot read RELR sections on Ubuntu 24.04.
          NO_STRIP: "1"
        run: cargo packager --release --formats "${{ matrix.package_formats }}"
